<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-to-Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            flex: 1;
            min-width: 80px;
        }

        .start-btn {
            background: #4CAF50;
            color: white;
        }

        .stop-btn {
            background: #f44336;
            color: white;
        }

        .copy-btn {
            background: #2196F3;
            color: white;
        }

        .clear-btn {
            background: #757575;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        #transcript {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 4px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.5;
            font-size: 14px;
        }

        #transcript.empty {
            color: #999;
            font-style: italic;
        }

        .interim {
            color: #999;
            font-style: italic;
        }

        #errorMessage {
            color: #d32f2f;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Speech-to-Text</h1>

        <label for="language">Language</label>
        <select id="language">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE">German</option>
            <option value="zh-CN">Chinese</option>
            <option value="ja-JP">Japanese</option>
        </select>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start</button>
            <button class="stop-btn" id="stopBtn" disabled>Stop</button>
            <button class="copy-btn" id="copyBtn">Copy</button>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>

        <div id="transcript" class="empty">Your transcript will appear here...</div>
        <div id="errorMessage"></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const transcript = document.getElementById('transcript');
        const errorMessage = document.getElementById('errorMessage');
        const languageSelect = document.getElementById('language');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            startBtn.disabled = true;
            errorMessage.textContent = 'Speech Recognition not supported in your browser.';
        }

        let recognition;
        let finalTranscript = '';

        startBtn.addEventListener('click', () => {
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = languageSelect.value;

            recognition.onstart = () => {
                startBtn.disabled = true;
                stopBtn.disabled = false;
                errorMessage.textContent = '';
                transcript.classList.remove('empty');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcriptText = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcriptText + ' ';
                    } else {
                        interimTranscript += transcriptText;
                    }
                }

                transcript.innerHTML = `${finalTranscript}<span class="interim">${interimTranscript}</span>`;
            };

            recognition.onerror = (event) => {
                errorMessage.textContent = 'Error: ' + event.error;
            };

            recognition.onend = () => {
                startBtn.disabled = false;
                stopBtn.disabled = true;
            };

            recognition.start();
        });

        stopBtn.addEventListener('click', () => {
            recognition.stop();
        });

        clearBtn.addEventListener('click', () => {
            finalTranscript = '';
            transcript.textContent = 'Your transcript will appear here...';
            transcript.classList.add('empty');
            errorMessage.textContent = '';
        });

        copyBtn.addEventListener('click', () => {
            const text = finalTranscript.trim();
            if (text) {
                navigator.clipboard.writeText(text);
                copyBtn.textContent = 'Copied!';
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                }, 1500);
            }
        });
    </script>
</body>
</html>
